<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Настройки Voice Fixer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; }
    h2 { margin-top: 0; color: #1f2937; }
    .card { background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 20px;}
    .field { margin-bottom: 15px; }
    label { font-weight: 500; font-size: 14px; display: block; margin-bottom: 5px; color: #374151;}
    input[type="password"], select, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-family: inherit; }
    textarea { height: 150px; resize: vertical; }
    button { padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; transition: background 0.2s;}
    button:hover { background: #1d4ed8; }
    #micBtn { background: #10b981; margin-top: 10px; }
    #micBtn:hover { background: #059669; }
    #status { color: #16a34a; margin-top: 10px; font-size: 14px; min-height: 20px; font-weight: 500;}
    h3 { margin-top: 0; margin-bottom: 15px; color: #1f2937; font-size: 16px; }
    .hint { font-size: 12px; color: #6b7280; margin-top: 5px; line-height: 1.4; }
  </style>
</head>
<body>
  <h2>Настройки Voice Fixer</h2>

  <div class="card">
    <h3>🎙️ Доступ к микрофону</h3>
    <p class="hint" style="margin-top: 0; margin-bottom: 10px;">Всплывающее окно (popup) расширения не всегда может само запросить доступ к микрофону. Нажмите кнопку ниже, чтобы один раз разрешить доступ на этой странице.</p>
    <button id="micBtn">Разрешить доступ к микрофону</button>
    <div id="micStatus" style="font-size: 14px; margin-top: 8px;"></div>
  </div>

  <div class="card">
    <h3>⚙️ Основные настройки</h3>
    <div class="field">
      <label for="apiKey">Ключ Google Gemini API:</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." />
      <div class="hint">Для получения бесплатного ключа перейдите в <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>.</div>
    </div>
    
    <div class="field">
      <label for="modelSelect">Модель Gemini:</label>
      <select id="modelSelect">
        <option value="gemini-1.5-flash">Gemini 1.5 Flash (Быстрая, по умолчанию)</option>
        <option value="gemini-1.5-pro">Gemini 1.5 Pro (Более умная, но медленнее)</option>
        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
        <option value="gemini-2.0-flash-lite-preview-02-05">Gemini 2.0 Flash Lite</option>
      </select>
    </div>

    <div class="field">
      <label for="promptText">Системный промпт (инструкция для корректировки текста):</label>
      <textarea id="promptText"></textarea>
    </div>

    <button id="save">Сохранить настройки</button>
    <div id="status"></div>
  </div>
  
  <script src="options.js"></script>
</body>
</html>
